[project]
name = "telyincore"
version = "0.1.0"
license = { text = "LicenseRef-TelyinCore-NonCommercial-1.0" }
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2", "httpx>=0.27", "anyio>=4", "websockets>=17.2,<18", "PyJWT[crypto]>=2.10,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
qq-voice = ["sherpa-onnx>=1.13,<2", "numpy>=1.26", "scipy>=1.11"]
qq-media = []  # Compatibility extra; the built-in image pipeline needs Pillow at startup.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]
